services:
  postgres:
    image: postgres:17-alpine
    container_name: treasurer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: treasurer
      POSTGRES_PASSWORD: treasurer
      POSTGRES_DB: treasurer_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U treasurer -d treasurer_db']
      interval: 5s
      timeout: 5s
      retries: 5

  dbhub:
    image: bytebase/dbhub:latest
    restart: unless-stopped
    ports:
      - '8080:8080'
    command:
      - '--transport=http'
      - '--port=8080'
      - '--dsn=postgresql://treasurer:treasurer@postgres:5432/treasurer_db?sslmode=disable'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
